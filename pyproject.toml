[project]
name = "kb-0515"
version = "0.1.0"
description = "Knowledge platform: traceable FastAPI and LangGraph baseline"
requires-python = ">=3.12,<3.14"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "requests>=2.32",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "minio>=7.2.20",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "pymilvus>=3.0.1",
    "dashscope>=1.26.7",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "pyjwt>=2.10,<3",
    "pwdlib[argon2]>=0.3,<1",
    "pymysql>=1.2.3",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "pillow>=11,<13",
    "redis>=8.1.0",
]

[project.optional-dependencies]
cpu = ["pymilvus[model]>=3.0.1", "flagembedding>=1.3.5", "transformers>=4.45,<5", "torch>=2.11.0"]
cuda = ["pymilvus[model]>=3.0.1", "flagembedding>=1.3.5", "transformers>=4.45,<5", "torch>=2.11.0"]
web-search = ["openai-agents>=0.20.0", "mcp>=1.28,<2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.50",
    "pymysql>=1.2.3",
    "redis>=8.1.0",
]

[project.scripts]
kb-0515 = "atguigu.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atguigu"
module-root = ""
source-include = ["uv.lock", "alembic.ini", "migrations/**", "scripts/**", "docs/**", "examples/**", "tests/**", "README.md", "THIRD_PARTY_NOTICES.md", ".github/**", ".editorconfig", ".gitattributes", ".gitignore", "知识库管理平台.md", "流程记忆.md", "阶段提示词.md", ".taste-skill/*.md", ".taste-skill/direction.json", ".env.example", "frontend/src/**", "frontend/index.html", "frontend/package.json", "frontend/package-lock.json", "frontend/tsconfig.json", "frontend/vite.config.ts", "compose.yaml", "deploy/**"]
source-exclude = ["docs/evidence/stage*/**", "deploy/vm/.env", "deploy/vm/redis.conf"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
